
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world-nextjs
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world-nextjs
                port:
                  number: 3000
