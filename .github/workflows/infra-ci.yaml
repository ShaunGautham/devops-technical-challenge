name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yaml'

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: '1.9.8'
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GAR_LOCATION || 'asia-southeast1' }}

jobs:
  validate:
    name: Format, initialize, validate, and preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra
        
      - name: Initialize without remote state
        run: terraform init -backend=false -input=false
        working-directory: infra
        
      - name: Validate configuration
        run: terraform validate
        working-directory: infra
        
      - name: Authenticate to Google Cloud for plan
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          
      - name: Plan infrastructure changes
        if: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_WIF_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' }}
        run: terraform plan -input=false -no-color
        working-directory: infra
        
      - name: Explain skipped plan
        if: ${{ vars.GCP_WIF_PROVIDER == '' || vars.GCP_WIF_SERVICE_ACCOUNT == '' || vars.GCP_PROJECT_ID == '' }}
        run: echo 'Plan skipped; configure GCP_PROJECT_ID, GCP_WIF_PROVIDER, and GCP_WIF_SERVICE_ACCOUNT repository variables.'

  deploy:
    name: Request Approval & Apply Changes
    needs: validate
    # 🔍 Rule 1: Only run on a hard push/merge to main, never on standard pull requests
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    
    # 🔍 Rule 2: Forces GitHub to pause and wait for a manual click before starting
    environment: production-deployment
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          
      - name: Authenticate to Google Cloud for apply
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          
      - name: Initialize with remote backend
        # Note: True deployment requires the remote state backend to tracking infrastructure mapping
        run: terraform init -input=false
        working-directory: infra
        
      - name: Apply Infrastructure Changes
        # 🔍 Rule 3: Safely deploys the live cloud assets automatically once approved
        run: terraform apply -auto-approve -input=false
        working-directory: infra