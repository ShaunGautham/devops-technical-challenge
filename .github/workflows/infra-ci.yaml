name: Terraform CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yaml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yaml'

permissions:
  contents: read

env:
  TF_VERSION: '1.9.8'
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GAR_LOCATION || 'asia-southeast1' }}

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Initialize without a backend
        run: terraform init -backend=false -input=false
        working-directory: infra

      - name: Validate configuration
        run: terraform validate
        working-directory: infra

      - name: Explain skipped plan
        if: ${{ vars.TF_STATE_BUCKET == '' || vars.GCP_WIF_PROVIDER == '' || vars.GCP_TF_WIF_SERVICE_ACCOUNT == '' || vars.GCP_PROJECT_ID == '' }}
        run: echo 'Plan skipped. Configure the state bucket, project, WIF provider, and Terraform service account to plan against real state.'

  plan:
    name: Plan against remote state
    needs: validate
    if: ${{ vars.TF_STATE_BUCKET != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_TF_WIF_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_WIF_SERVICE_ACCOUNT }}

      - name: Initialize remote state
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="prefix=devops-technical-challenge/infra"
        working-directory: infra

      - name: Plan infrastructure changes
        run: terraform plan -input=false -lock-timeout=5m -no-color
        working-directory: infra

  apply:
    name: Apply after protected environment approval
    needs: [validate, plan]
    if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' && vars.TF_APPLY_ENABLED == 'true' && vars.TF_STATE_BUCKET != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_TF_WIF_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    environment: production-deployment
    permissions:
      contents: read
      id-token: write
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_WIF_SERVICE_ACCOUNT }}

      - name: Initialize remote state
        run: >-
          terraform init -input=false -reconfigure
          -backend-config="bucket=${TF_STATE_BUCKET}"
          -backend-config="prefix=devops-technical-challenge/infra"
        working-directory: infra

      - name: Create and apply the reviewed configuration
        run: |
          terraform plan -input=false -lock-timeout=5m -out=tfplan
          terraform apply -input=false tfplan
        working-directory: infra
