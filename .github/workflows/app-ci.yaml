name: Application CI and GitOps image update

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build, and preview manifests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Setup Kustomize
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Validate and Preview Production Manifests
        if: github.event_name == 'pull_request'
        run: |
          cd ../k8s/overlays/production
          echo "### 📋 Kustomize Build Preview (Production)" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> "$GITHUB_STEP_SUMMARY"
          kustomize build . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> $GITHUB_STEP_SUMMARY

  publish:
    name: Build, push, and record image in Git
    needs: validate
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      IMAGE_URI: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/hello-world-nextjs
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          
      - uses: docker/setup-buildx-action@v3

      - name: Setup Kustomize
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: false
      - run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
      
      # Build locally first so the image can be scanned before it is pushed.
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v6
        with:
          context: ./application
          file: ./application/Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_URI }}:${{ github.sha }}
      
      # Scan the built image before it is pushed to Artifact Registry.
      - name: Run Vulnerability Scanner (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_URI }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          
      # Push only after the scan succeeds.
      - name: Push Clean Image to Artifact Registry
        run: |
          docker push ${{ env.IMAGE_URI }}:${{ github.sha }}
          
      - name: Update production Kustomize image
        env:
          IMAGE_TAG: ${{ github.sha }}

        run: |
          cd k8s/overlays/production
          kustomize edit set image "hello-world-nextjs=${IMAGE_URI}:${IMAGE_TAG}"

      - name: Validate updated production manifests
        run: |
          cd k8s/overlays/production
          kustomize build . > /tmp/production-manifests.yaml
          echo 'Production manifests rendered successfully after the image update.' >> "$GITHUB_STEP_SUMMARY"
          
      - name: Commit image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main
