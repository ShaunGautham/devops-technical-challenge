name: Application CI and GitOps image update

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build, and preview manifests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/package-lock.json
          
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # 🔍 Satisfies the infrastructure check on Pull Requests rule
      - name: Validate and Preview Production Manifests
        if: github.event_name == 'pull_request'
        run: |
          cd ../k8s/overlays/production
          echo "### 📋 Kustomize Build Preview (Production)" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> \$GITHUB_STEP_SUMMARY
          kustomize build . >> \$GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  publish:
    name: Build, push, and record image in Git
    needs: validate
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      IMAGE_URI: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/hello-world-nextjs
    steps:
      - uses: actions/checkout@v4
      
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
          
      - uses: docker/setup-buildx-action@v3
      
      - uses: docker/build-push-action@v6
        with:
          context: ./application
          file: ./application/Dockerfile
          push: true
          tags: ${{ env.IMAGE_URI }}:${{ github.sha }}
          
      - name: Update production Kustomize image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s/overlays/production
          # Safely substitutes both newName and newTag matching the key 'hello-world-nextjs'
          kustomize edit set image hello-world-nextjs=${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
          
      - name: Commit image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push origin HEAD:main