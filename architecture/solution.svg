<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">DevOps solution architecture in four blocks</title>
<desc id="desc">Four independent views of Terraform-defined GCP infrastructure, Kubernetes traffic and workload objects, the application delivery pipeline, and repository structure. The resources are not deployed.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#526579"/></marker>
  <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#315f9c"/></marker>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:31px;font-weight:700}.sub{font-size:15px;fill:#526579}
    .panel{fill:#fbfcfe;stroke:#c6d1dc;stroke-width:2;rx:16}.head{font-size:21px;font-weight:700}.node{fill:#fff;stroke:#66829a;stroke-width:1.7;rx:10}.cloud{fill:#eff8f1;stroke:#548363;stroke-width:1.7;rx:10}.external{fill:#fff7e9;stroke:#b7791f;stroke-width:1.7;rx:10}.soft{fill:#edf4ff;stroke:#52799a;stroke-width:1.7;rx:10}.nt{font-size:16px;font-weight:700}.sm{font-size:13px;fill:#526579}.edge{stroke:#526579;stroke-width:2.2;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}.ctl{stroke:#315f9c;stroke-width:2;fill:none;marker-end:url(#blueArrow);stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round}.foot{font-size:13px;fill:#526579}
  </style>
</defs>
<rect width="1600" height="1120" fill="#fff"/>
<text x="48" y="52" class="title">DevOps challenge · solution architecture</text>
<text x="48" y="80" class="sub">Four focused views · reflects repository configuration · Terraform resources are not deployed</text>

<!-- Infrastructure -->
<rect x="40" y="112" width="740" height="440" class="panel"/>
<text x="68" y="151" class="head">1 · Infrastructure</text>
<text x="68" y="176" class="sub">Terraform defines GCP resources and their connections</text>
<rect x="70" y="215" width="140" height="65" class="soft"/><text x="140" y="244" text-anchor="middle" class="nt">Terraform</text><text x="140" y="264" text-anchor="middle" class="sm">infra/</text>
<rect x="270" y="215" width="185" height="65" class="node"/><text x="362" y="243" text-anchor="middle" class="nt">Custom VPC</text><text x="362" y="264" text-anchor="middle" class="sm">subnet + GKE ranges</text>
<rect x="515" y="215" width="210" height="65" class="node"/><text x="620" y="243" text-anchor="middle" class="nt">Regional GKE</text><text x="620" y="264" text-anchor="middle" class="sm">Workload Identity enabled</text>
<path d="M210 247H270M455 247H515" class="edge"/>
<rect x="515" y="325" width="210" height="65" class="node"/><text x="620" y="353" text-anchor="middle" class="nt">Node pool</text><text x="620" y="374" text-anchor="middle" class="sm">1–2 nodes total</text>
<path d="M620 280V325" class="edge"/>
<rect x="270" y="325" width="185" height="65" class="cloud"/><text x="362" y="353" text-anchor="middle" class="nt">Artifact Registry</text><text x="362" y="374" text-anchor="middle" class="sm">nodes pull app image</text>
<path d="M455 357H515" class="edge"/>
<rect x="70" y="325" width="140" height="65" class="cloud"/><text x="140" y="353" text-anchor="middle" class="nt">Cloud Logging</text><text x="140" y="374" text-anchor="middle" class="sm">container logs</text>
<rect x="270" y="430" width="185" height="65" class="cloud"/><text x="362" y="458" text-anchor="middle" class="nt">Log sink</text><text x="362" y="479" text-anchor="middle" class="sm">exports selected logs</text>
<rect x="515" y="430" width="210" height="65" class="cloud"/><text x="620" y="458" text-anchor="middle" class="nt">GCS log bucket</text><text x="620" y="479" text-anchor="middle" class="sm">versioned · 90-day lifecycle</text>
<path d="M210 357H240V462H270M455 462H515M620 390V410H140V390" class="edge"/>
<text x="70" y="526" class="foot">Terraform state uses a separate, pre-created GCS bucket.</text>

<!-- Kubernetes -->
<rect x="820" y="112" width="740" height="440" class="panel"/>
<text x="848" y="151" class="head">2 · Kubernetes and traffic</text>
<text x="848" y="176" class="sub">Ingress routes requests; the Service selects ready Pods</text>
<rect x="845" y="225" width="100" height="66" class="external"/><text x="895" y="254" text-anchor="middle" class="nt">User</text><text x="895" y="275" text-anchor="middle" class="sm">request</text>
<rect x="970" y="225" width="125" height="66" class="external"/><text x="1032" y="252" text-anchor="middle" class="nt">GKE LB</text><text x="1032" y="275" text-anchor="middle" class="sm">managed</text>
<rect x="1120" y="225" width="105" height="66" class="node"/><text x="1172" y="254" text-anchor="middle" class="nt">Ingress</text><text x="1172" y="275" text-anchor="middle" class="sm">route /</text>
<rect x="1250" y="225" width="120" height="66" class="node"/><text x="1310" y="252" text-anchor="middle" class="nt">Service</text><text x="1310" y="275" text-anchor="middle" class="sm">ClusterIP :3000</text>
<rect x="1395" y="225" width="135" height="66" class="node"/><text x="1462" y="252" text-anchor="middle" class="nt">Ready Pods</text><text x="1462" y="275" text-anchor="middle" class="sm">Next.js</text>
<path d="M945 258H970M1095 258H1120M1225 258H1250M1370 258H1395" class="edge"/>
<rect x="970" y="365" width="250" height="72" class="soft"/><text x="1095" y="394" text-anchor="middle" class="nt">Deployment</text><text x="1095" y="418" text-anchor="middle" class="sm">2 replicas · RollingUpdate</text>
<rect x="1260" y="365" width="130" height="72" class="soft"/><text x="1325" y="394" text-anchor="middle" class="nt">HPA</text><text x="1325" y="418" text-anchor="middle" class="sm">2–5 · CPU 70%</text>
<rect x="1410" y="365" width="120" height="72" class="soft"/><text x="1470" y="394" text-anchor="middle" class="nt">PDB</text><text x="1470" y="418" text-anchor="middle" class="sm">min: 1</text>
<path d="M1095 365V330H1462V291" class="edge"/>
<path d="M1260 401H1220" class="ctl"/><path d="M1410 401H1390V330H1462V291" class="ctl"/>
<text x="848" y="487" class="foot">Dashed arrows show scaling and disruption policy, not user traffic. No TLS is configured.</text>

<!-- Application pipeline -->
<rect x="40" y="580" width="740" height="490" class="panel"/>
<text x="68" y="619" class="head">3 · Application pipeline</text>
<text x="68" y="644" class="sub">A source change becomes an image, then a GitOps deployment</text>
<rect x="70" y="690" width="180" height="78" class="external"/><text x="160" y="721" text-anchor="middle" class="nt">Push to main</text><text x="160" y="746" text-anchor="middle" class="sm">source change</text>
<rect x="300" y="690" width="190" height="78" class="soft"/><text x="395" y="721" text-anchor="middle" class="nt">GitHub Actions</text><text x="395" y="746" text-anchor="middle" class="sm">install · lint · build</text>
<rect x="540" y="690" width="200" height="78" class="cloud"/><text x="640" y="721" text-anchor="middle" class="nt">Build + Trivy</text><text x="640" y="746" text-anchor="middle" class="sm">SHA tag · scan gate</text>
<path d="M250 729H300M490 729H540" class="edge"/>
<rect x="540" y="835" width="200" height="78" class="cloud"/><text x="640" y="866" text-anchor="middle" class="nt">Artifact Registry</text><text x="640" y="891" text-anchor="middle" class="sm">publish if scan passes</text>
<rect x="300" y="835" width="190" height="78" class="soft"/><text x="395" y="866" text-anchor="middle" class="nt">Update overlay</text><text x="395" y="891" text-anchor="middle" class="sm">Kustomize image SHA</text>
<rect x="70" y="835" width="180" height="78" class="external"/><text x="160" y="866" text-anchor="middle" class="nt">Commit to Git</text><text x="160" y="891" text-anchor="middle" class="sm">updated production overlay</text>
<path d="M640 768V835M540 874H490M300 874H250" class="edge"/>
<rect x="70" y="960" width="300" height="65" class="soft"/><text x="220" y="988" text-anchor="middle" class="nt">Argo CD watches Git</text><text x="220" y="1011" text-anchor="middle" class="sm">reconciles the production overlay</text>
<rect x="440" y="960" width="300" height="65" class="soft"/><text x="590" y="988" text-anchor="middle" class="nt">Kubernetes rollout</text><text x="590" y="1011" text-anchor="middle" class="sm">nodes pull the published image</text>
<path d="M160 913V940H220V960M370 992H440" class="edge"/>
<text x="68" y="1045" class="foot">Pull requests: checks + preview · main: publish + Git commit · WIF, no cluster credentials</text>

<!-- Repository structure -->
<rect x="820" y="580" width="740" height="490" class="panel"/>
<text x="848" y="619" class="head">4 · Repository structure</text>
<text x="848" y="644" class="sub">Separate code by responsibility; share Kubernetes defaults through a base</text>
<rect x="1030" y="675" width="320" height="52" class="soft"/><text x="1190" y="708" text-anchor="middle" class="nt">Repository root</text>
<path d="M1190 727V755H960V780M1190 755V780M1190 755H1440V780M1190 755V870H1080V895M1190 870H1440V895" class="edge"/>
<rect x="850" y="780" width="220" height="75" class="node"/><text x="960" y="811" text-anchor="middle" class="nt">application/</text><text x="960" y="836" text-anchor="middle" class="sm">Next.js + Dockerfile</text>
<rect x="1080" y="780" width="220" height="75" class="node"/><text x="1190" y="811" text-anchor="middle" class="nt">infra/</text><text x="1190" y="836" text-anchor="middle" class="sm">GCP Terraform</text>
<rect x="1330" y="780" width="220" height="75" class="node"/><text x="1440" y="811" text-anchor="middle" class="nt">.github/workflows/</text><text x="1440" y="836" text-anchor="middle" class="sm">App + Terraform CI</text>
<rect x="850" y="895" width="460" height="112" class="node"/><text x="1080" y="924" text-anchor="middle" class="nt">k8s/</text><text x="1080" y="950" text-anchor="middle" class="sm">base/: Deployment + Service</text><text x="1080" y="974" text-anchor="middle" class="sm">overlays/production/: Ingress · HPA · PDB · image</text><text x="1080" y="998" text-anchor="middle" class="sm">argocd/: Helmfile + Application bootstrap</text>
<rect x="1330" y="895" width="220" height="112" class="node"/><text x="1440" y="924" text-anchor="middle" class="nt">Docs + diagrams</text><text x="1440" y="950" text-anchor="middle" class="sm">README + ARCHITECTURE</text><text x="1440" y="977" text-anchor="middle" class="sm">architecture/ sources + SVG</text>
<text x="848" y="1036" class="foot">docker-compose.yml provides the local run path; .env.example contains no credentials.</text>
</svg>
